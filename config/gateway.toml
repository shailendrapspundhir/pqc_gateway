[server]
bind_address = "0.0.0.0"
http_port = 8090
drain_timeout_seconds = 30
max_request_body_bytes = 10485760  # 10 MB

[logging]
level = "info"
format = "pretty"

[tls]
enabled = false
cert_file = "config/certs/server.crt"
key_file = "config/certs/server.key"
min_version = "1.3"
pqc_enabled = true
https_port = 8443
# ca_file = "config/certs/ca.crt"  # Uncomment for mutual TLS

# Signature configuration: "classical" | "hybrid" | "mldsa-only"
# Can be overridden globally by PQC_SIGNATURE_MODE env var,
# or per-route via signature_mode field on each [[routes]] entry.
[signatures]
default_mode = "hybrid"

# JWT + ML-DSA-65 authentication
[auth]
enabled = false
issuer = "pqc-gateway"
audience = "pqc-gateway-api"
token_ttl_seconds = 3600
public_paths = ["/health", "/.well-known/", "/ready", "/metrics"]

# Admin listener (separate port, API-key protected)
# The admin listener hosts /admin/* and /auth/* endpoints.
# Set api_key here or via GATEWAY_ADMIN_API_KEY env var.
[admin]
enabled = true
bind_address = "127.0.0.1"
port = 9090
# api_key = "change-me-in-production"

# Circuit breaker for upstream health
[circuit_breaker]
enabled = true
failure_threshold = 5
recovery_timeout_ms = 30000
health_check_interval_ms = 10000
health_check_path = "/health"

# Threshold key management (Shamir's Secret Sharing)
[threshold]
enabled = true
threshold = 3
total_shares = 5
max_retained_keys = 5

# Rate limiting (token-bucket)
[rate_limit]
enabled = false
default_requests = 1000
default_window_seconds = 60

# Prometheus metrics
[metrics]
enabled = true
path = "/metrics"

[[routes]]
id = "api-service-items"
path_prefix = "/api/v1/items"
upstream = "http://127.0.0.1:9001"
strip_prefix = false
methods = ["GET", "POST", "PUT", "DELETE"]
timeout_ms = 10000
signature_mode = "hybrid"

[[routes]]
id = "api-service-secure"
path_prefix = "/api/v1/secure"
upstream = "http://127.0.0.1:9001"
strip_prefix = false
methods = ["GET", "POST", "DELETE"]
timeout_ms = 5000
signature_mode = "mldsa-only"

[[routes]]
id = "api-service-ws"
path_prefix = "/ws"
upstream = "http://127.0.0.1:9001"
strip_prefix = false
methods = ["GET"]
timeout_ms = 30000

[[routes]]
id = "test-service-echo"
path_prefix = "/test/echo"
upstream = "http://127.0.0.1:9002"
strip_prefix = false
methods = ["GET", "POST", "PUT", "DELETE"]
timeout_ms = 5000

[[routes]]
id = "test-service-health"
path_prefix = "/test/health"
upstream = "http://127.0.0.1:9002"
strip_prefix = false
methods = ["GET"]
timeout_ms = 5000

[[routes]]
id = "test-service-headers"
path_prefix = "/test/headers"
upstream = "http://127.0.0.1:9002"
strip_prefix = false
methods = ["GET"]
timeout_ms = 5000